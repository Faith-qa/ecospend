services:
  postgres:
    image: postgres:16-alpine
    container_name: ecospend-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ecospend}
      POSTGRES_USER: ${DB_USERNAME:-ecospend}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ecospend}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ecospend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ecospend} -d ${DB_NAME:-ecospend}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ecospend_postgres_data:
